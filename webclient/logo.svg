<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="TESmart KVM multiviewer">
  <!-- Multiviewer mark: a screen split into one hero view + two source thumbnails,
       with a red on-air tally dot. Colours are the app's own tokens:
       accent #4fc3f7 (live hero), gray-700 #343a44 (other sources),
       tally #f23f43 (the source under control), surface #1a1d22 (panel). -->
  <rect x="2.5" y="3.5" width="27" height="25" rx="4.5" fill="#1a1d22" stroke="#4fc3f7" stroke-width="2"/>
  <rect x="6.5" y="8.5" width="11.5" height="15" rx="1.8" fill="#4fc3f7"/>
  <rect x="19.3" y="8.5" width="6.2" height="6.8" rx="1.3" fill="#343a44"/>
  <rect x="19.3" y="16.7" width="6.2" height="6.8" rx="1.3" fill="#343a44"/>
  <circle cx="9.4" cy="11.4" r="1.55" fill="#f23f43"/>
</svg>
